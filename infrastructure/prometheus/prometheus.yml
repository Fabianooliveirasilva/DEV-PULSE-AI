global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: devpulse-api
    metrics_path: /api/v1/metrics
    authorization:
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: ['api:4000']

  - job_name: devpulse-worker
    metrics_path: /metrics
    authorization:
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: ['worker:9464']
