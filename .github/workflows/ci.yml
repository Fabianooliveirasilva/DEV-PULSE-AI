name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1
  # Test-only credentials for ephemeral service containers. No real secrets are used in CI.
  TEST_DATABASE_URL: postgresql://devpulse:devpulse@localhost:5432/devpulse_test
  E2E_DATABASE_URL: postgresql://devpulse:devpulse@localhost:5432/devpulse_test

jobs:
  quality:
    name: Format · lint · types · unit tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: devpulse, POSTGRES_PASSWORD: devpulse, POSTGRES_DB: devpulse_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devpulse" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      # Exercise the production queue backend (Redis) in CI.
      TEST_QUEUE_BACKEND: redis
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm test:integration

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: devpulse, POSTGRES_PASSWORD: devpulse, POSTGRES_DB: devpulse_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devpulse" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    env:
      E2E_QUEUE_BACKEND: redis
      E2E_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @devpulse/database exec prisma migrate deploy
        env: { DATABASE_URL: '${{ env.E2E_DATABASE_URL }}' }
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            tests/e2e/report
            tests/e2e/results
          retention-days: 14

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        target: [migrate, api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          tags: devpulse-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  security:
    name: Dependency audit & static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Fails on high/critical advisories in production dependencies.
      - run: pnpm audit --prod --audit-level high
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v3
